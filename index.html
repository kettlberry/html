<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оплата</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    /* ─── Design Tokens ─── */
    :root, [data-theme="light"] {
      --color-bg:             #f0f4ff;
      --color-surface:        #ffffff;
      --color-surface-2:      #f7f9ff;
      --color-surface-offset: #eef1fb;
      --color-divider:        #dde2f0;
      --color-border:         #c8cfe8;
      --color-text:           #1a1d2e;
      --color-text-muted:     #5a6080;
      --color-text-faint:     #9ba3c4;
      --color-text-inverse:   #ffffff;
      --color-primary:        #4f46e5;
      --color-primary-hover:  #3730b0;
      --color-primary-active: #2e2890;
      --color-primary-highlight: #e0e0ff;
      --color-success:        #16a34a;
      --color-success-hover:  #15803d;
      --color-success-highlight: #dcfce7;
      --color-error:          #dc2626;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.5rem;
      --radius-full: 9999px;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
      --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
      --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
      --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);
      --text-xl:   clamp(1.5rem,   1.2rem  + 1.25vw, 2.25rem);
      --text-2xl:  clamp(2rem,     1.2rem  + 2.5vw,  3.5rem);
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body:    'Inter', 'Helvetica Neue', sans-serif;
      --shadow-sm: 0 1px 3px oklch(0.25 0.05 270 / 0.08);
      --shadow-md: 0 4px 16px oklch(0.25 0.05 270 / 0.10);
      --shadow-lg: 0 16px 48px oklch(0.25 0.05 270 / 0.14);
      --shadow-glow: 0 0 0 4px oklch(0.6 0.18 280 / 0.18);
      --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --color-bg:             #0f1020;
      --color-surface:        #161828;
      --color-surface-2:      #1c1f32;
      --color-surface-offset: #1a1d2e;
      --color-divider:        #252840;
      --color-border:         #2e324f;
      --color-text:           #e2e5f4;
      --color-text-muted:     #8890b8;
      --color-text-faint:     #4a5070;
      --color-text-inverse:   #0f1020;
      --color-primary:        #818cf8;
      --color-primary-hover:  #a5b4fc;
      --color-primary-active: #c7d2fe;
      --color-primary-highlight: #1e1f4a;
      --color-success:        #4ade80;
      --color-success-hover:  #86efac;
      --color-success-highlight: #052e16;
      --color-error:          #f87171;
      --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.25);
      --shadow-md: 0 4px 16px oklch(0 0 0 / 0.35);
      --shadow-lg: 0 16px 48px oklch(0 0 0 / 0.50);
      --shadow-glow: 0 0 0 4px oklch(0.65 0.15 280 / 0.22);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --color-bg: #0f1020; --color-surface: #161828; --color-surface-2: #1c1f32;
        --color-surface-offset: #1a1d2e; --color-divider: #252840; --color-border: #2e324f;
        --color-text: #e2e5f4; --color-text-muted: #8890b8; --color-text-faint: #4a5070;
        --color-text-inverse: #0f1020; --color-primary: #818cf8; --color-primary-hover: #a5b4fc;
        --color-primary-active: #c7d2fe; --color-primary-highlight: #1e1f4a;
        --color-success: #4ade80; --color-success-hover: #86efac; --color-success-highlight: #052e16;
        --color-error: #f87171;
        --shadow-sm: 0 1px 3px oklch(0 0 0 / 0.25);
        --shadow-md: 0 4px 16px oklch(0 0 0 / 0.35);
        --shadow-lg: 0 16px 48px oklch(0 0 0 / 0.50);
        --shadow-glow: 0 0 0 4px oklch(0.65 0.15 280 / 0.22);
      }
    }

    /* ─── Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      scroll-behavior: smooth;
    }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-text);
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6) var(--space-4);
      position: relative;
      overflow-x: hidden;
    }
    img, svg { display: block; }
    input, button, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    a, button, [role="button"], input {
      transition: color var(--transition-interactive),
                  background var(--transition-interactive),
                  border-color var(--transition-interactive),
                  box-shadow var(--transition-interactive),
                  opacity var(--transition-interactive),
                  transform var(--transition-interactive);
    }
    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ─── Background Mesh ─── */
    .bg-mesh {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .bg-mesh::before,
    .bg-mesh::after {
      content: '';
      position: absolute;
      border-radius: var(--radius-full);
      filter: blur(80px);
      opacity: 0.35;
    }
    .bg-mesh::before {
      width: 600px; height: 600px;
      top: -120px; left: -100px;
      background: radial-gradient(circle, oklch(0.65 0.20 280) 0%, transparent 70%);
    }
    .bg-mesh::after {
      width: 500px; height: 500px;
      bottom: -100px; right: -80px;
      background: radial-gradient(circle, oklch(0.65 0.22 230) 0%, transparent 70%);
    }
    [data-theme="dark"] .bg-mesh::before { opacity: 0.20; }
    [data-theme="dark"] .bg-mesh::after  { opacity: 0.18; }

    /* ─── Theme Toggle ─── */
    .theme-toggle {
      position: fixed; top: var(--space-4); right: var(--space-4); z-index: 100;
      width: 40px; height: 40px;
      border-radius: var(--radius-full);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text-muted);
      box-shadow: var(--shadow-sm);
    }
    .theme-toggle:hover { color: var(--color-text); box-shadow: var(--shadow-md); }
    .theme-toggle:active { transform: scale(0.93); }

    /* ─── Card ─── */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      background: var(--color-surface);
      border: 1px solid oklch(from var(--color-border) l c h / 0.7);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg);
      padding: var(--space-8) var(--space-8);
      overflow: hidden;
    }
    @media (max-width: 480px) {
      .card { padding: var(--space-6) var(--space-5); }
    }

    /* Card shimmer top border */
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg in oklch,
        var(--color-primary), oklch(0.65 0.22 230), var(--color-primary));
      background-size: 200% 100%;
      animation: shimmer-border 3s linear infinite;
    }
    @keyframes shimmer-border {
      0%   { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    /* ─── Logo / Header ─── */
    .card-logo {
      display: flex; align-items: center; gap: var(--space-3);
      margin-bottom: var(--space-6);
    }
    .logo-mark {
      width: 40px; height: 40px; flex-shrink: 0;
    }
    .logo-label {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-style: italic;
      color: var(--color-text);
      line-height: 1;
    }
    .logo-label span {
      display: block;
      font-size: var(--text-xs);
      font-style: normal;
      font-family: var(--font-body);
      font-weight: 500;
      color: var(--color-text-muted);
      margin-top: 2px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 400;
      color: var(--color-text);
      line-height: 1.2;
      margin-bottom: var(--space-2);
    }
    .card-subtitle {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-8);
      line-height: 1.5;
    }

    /* ─── Divider ─── */
    .divider {
      height: 1px;
      background: var(--color-divider);
      margin: var(--space-6) 0;
    }

    /* ─── Form ─── */
    .form-group {
      display: flex; flex-direction: column; gap: var(--space-2);
      margin-bottom: var(--space-6);
    }
    .form-label {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text);
    }
    .input-wrapper {
      position: relative;
    }
    .currency-sign {
      position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%);
      font-size: var(--text-lg);
      font-weight: 600;
      color: var(--color-text-muted);
      pointer-events: none;
      transition: color var(--transition-interactive);
    }
    .amount-input {
      width: 100%;
      padding: var(--space-4) var(--space-4) var(--space-4) calc(var(--space-4) + 1.4rem);
      font-size: var(--text-lg);
      font-weight: 600;
      background: var(--color-surface-2);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      color: var(--color-text);
      outline: none;
      appearance: textfield;
      -moz-appearance: textfield;
    }
    .amount-input::-webkit-outer-spin-button,
    .amount-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .amount-input::placeholder { color: var(--color-text-faint); font-weight: 400; }
    .amount-input:hover { border-color: oklch(from var(--color-primary) l c h / 0.5); }
    .amount-input:focus {
      border-color: var(--color-primary);
      box-shadow: var(--shadow-glow);
      background: var(--color-surface);
    }
    .amount-input:focus ~ .currency-sign,
    .input-wrapper:focus-within .currency-sign { color: var(--color-primary); }
    .input-hint {
      font-size: var(--text-xs);
      color: var(--color-text-faint);
    }
    .input-hint.error {
      color: var(--color-error);
      display: none;
    }
    .input-hint.error.visible { display: block; }

    /* ─── Security Badges ─── */
    .security-row {
      display: flex; align-items: center; gap: var(--space-2);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex; align-items: center; gap: var(--space-1);
      padding: 3px var(--space-2);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 500;
      background: var(--color-primary-highlight);
      color: var(--color-primary);
      border: 1px solid oklch(from var(--color-primary) l c h / 0.15);
    }
    [data-theme="dark"] .badge { background: var(--color-primary-highlight); }

    /* ─── Pay Button ─── */
    .btn-pay {
      width: 100%;
      padding: var(--space-4) var(--space-6);
      font-size: var(--text-base);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--color-text-inverse);
      background: var(--color-primary);
      border-radius: var(--radius-lg);
      border: none;
      box-shadow: 0 2px 8px oklch(from var(--color-primary) l c h / 0.35),
                  0 1px 2px oklch(from var(--color-primary) l c h / 0.20);
      display: flex; align-items: center; justify-content: center; gap: var(--space-2);
      user-select: none;
    }
    .btn-pay:not(:disabled):hover {
      background: var(--color-primary-hover);
      box-shadow: 0 4px 16px oklch(from var(--color-primary) l c h / 0.40),
                  0 1px 3px oklch(from var(--color-primary) l c h / 0.25);
      transform: translateY(-1px);
    }
    .btn-pay:not(:disabled):active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 1px 4px oklch(from var(--color-primary) l c h / 0.3);
    }
    .btn-pay:disabled {
      background: var(--color-border);
      color: var(--color-text-faint);
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-icon { flex-shrink: 0; }

    /* ─── Footer ─── */
    .card-footer {
      margin-top: var(--space-5);
      display: flex; align-items: center; justify-content: center; gap: var(--space-2);
      color: var(--color-text-faint);
      font-size: var(--text-xs);
    }

    /* ─── Success Overlay ─── */
    .success-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: var(--space-6);
      background: oklch(from var(--color-bg) l c h / 0.92);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 400ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .success-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .success-card {
      background: var(--color-surface);
      border: 1px solid oklch(from var(--color-border) l c h / 0.7);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg);
      padding: var(--space-10) var(--space-8);
      max-width: 380px; width: 100%;
      text-align: center;
      transform: scale(0.88) translateY(24px);
      transition: transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      position: relative;
    }
    .success-overlay.active .success-card {
      transform: scale(1) translateY(0);
    }
    .success-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--color-success), oklch(0.65 0.22 160), var(--color-success));
    }
    .success-icon-wrap {
      width: 72px; height: 72px;
      border-radius: var(--radius-full);
      background: var(--color-success-highlight);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-5);
      position: relative;
    }
    .success-icon-wrap svg { color: var(--color-success); }
    .success-checkmark {
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      transition: stroke-dashoffset 600ms cubic-bezier(0.16, 1, 0.3, 1) 200ms;
    }
    .success-overlay.active .success-checkmark { stroke-dashoffset: 0; }
    .success-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 400;
      color: var(--color-text);
      margin-bottom: var(--space-3);
      line-height: 1.2;
    }
    .success-body {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      line-height: 1.6;
      max-width: 28ch; margin: 0 auto var(--space-6);
    }
    .success-amount {
      display: inline-block;
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--color-success);
      background: var(--color-success-highlight);
      border-radius: var(--radius-full);
      padding: var(--space-1) var(--space-4);
      margin-bottom: var(--space-6);
    }
    .btn-new-payment {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      font-size: var(--text-sm);
      font-weight: 600;
      border-radius: var(--radius-lg);
      color: var(--color-primary);
      background: var(--color-primary-highlight);
      border: 1px solid oklch(from var(--color-primary) l c h / 0.15);
    }
    .btn-new-payment:hover {
      background: oklch(from var(--color-primary-highlight) l c h / 0.85);
      transform: translateY(-1px);
    }
    .btn-new-payment:active { transform: scale(0.97); }

    /* ─── Confetti ─── */
    .confetti-particle {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 300;
      animation: confetti-fall var(--duration) ease-in forwards;
    }
    @keyframes confetti-fall {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
    }

    /* ─── Loading spin ─── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.7s linear infinite; }

    /* ─── Pulse on input value ─── */
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 oklch(from var(--color-primary) l c h / 0); }
      50% { box-shadow: 0 0 0 4px oklch(from var(--color-primary) l c h / 0.15); }
    }
    .amount-input.pulse { animation: pulse-border 0.4s ease; }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg-mesh" aria-hidden="true"></div>

  <!-- Theme Toggle -->
  <button class="theme-toggle" data-theme-toggle aria-label="Переключить тему">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>

  <!-- Payment Card -->
  <main class="card" role="main">

    <!-- Logo -->
    <div class="card-logo">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-label="Pay logo">
        <rect width="40" height="40" rx="10" fill="var(--color-primary)"/>
        <rect x="8" y="14" width="24" height="3" rx="1.5" fill="white" opacity="0.3"/>
        <rect x="8" y="12" width="24" height="4" rx="2" fill="white"/>
        <rect x="8" y="21" width="10" height="3" rx="1.5" fill="white" opacity="0.7"/>
        <rect x="8" y="26" width="14" height="3" rx="1.5" fill="white" opacity="0.5"/>
        <circle cx="30" cy="27.5" r="4.5" fill="white" opacity="0.9"/>
        <path d="M27.5 27.5l1.5 1.5 3-3" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="logo-label">
        PayFlow
        <span>Безопасные платежи</span>
      </div>
    </div>

    <h1 class="card-title">Оплата заказа</h1>
    <p class="card-subtitle">Введите сумму для оплаты. Все транзакции защищены шифрованием.</p>

    <div class="divider"></div>

    <!-- Amount Input -->
    <div class="form-group">
      <label class="form-label" for="amount-input">Сумма платежа</label>
      <div class="input-wrapper">
        <span class="currency-sign" aria-hidden="true">₽</span>
        <input
          id="amount-input"
          class="amount-input"
          type="number"
          min="1"
          step="any"
          placeholder="0.00"
          autocomplete="off"
          inputmode="decimal"
          aria-describedby="amount-hint amount-error"
        />
      </div>
      <p id="amount-hint" class="input-hint">Минимальная сумма — 1 ₽</p>
      <p id="amount-error" class="input-hint error" role="alert">Введите сумму больше нуля</p>
    </div>

    <!-- Security Badges -->
    <div class="security-row" aria-label="Информация о безопасности">
      <span class="badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        SSL
      </span>
      <span class="badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        3D Secure
      </span>
      <span class="badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        PCI DSS
      </span>
    </div>

    <!-- Pay Button -->
    <button class="btn-pay" id="pay-btn" disabled aria-disabled="true">
      <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
        <line x1="1" y1="10" x2="23" y2="10"/>
      </svg>
      Оплатить
    </button>

    <!-- Footer -->
    <div class="card-footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Защищено шифрованием TLS 1.3
    </div>

  </main>

  <!-- Success Overlay -->
  <div class="success-overlay" id="success-overlay" role="dialog" aria-modal="true" aria-label="Оплата успешна" aria-live="polite">
    <div class="success-card">
      <div class="success-icon-wrap">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="success-checkmark" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h2 class="success-title">Оплата прошла успешно!</h2>
      <p class="success-body">Благодарим вас за покупку. Чек отправлен на вашу почту.</p>
      <div class="success-amount" id="success-amount" aria-label="Оплаченная сумма"></div>
      <button class="btn-new-payment" id="new-payment-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Новый платёж
      </button>
    </div>
  </div>

  <script>
    // ─── Theme Toggle ───
    (function () {
      const t = document.querySelector('[data-theme-toggle]');
      const r = document.documentElement;
      let d = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      r.setAttribute('data-theme', d);
      updateIcon();
      t && t.addEventListener('click', () => {
        d = d === 'dark' ? 'light' : 'dark';
        r.setAttribute('data-theme', d);
        updateIcon();
      });
      function updateIcon() {
        if (!t) return;
        t.setAttribute('aria-label', 'Переключить на ' + (d === 'dark' ? 'светлую' : 'тёмную') + ' тему');
        t.innerHTML = d === 'dark'
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`
          : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
      }
    })();

    // ─── Amount Input Logic ───
    const input   = document.getElementById('amount-input');
    const payBtn  = document.getElementById('pay-btn');
    const errorEl = document.getElementById('amount-error');

    function formatAmount(val) {
      const num = parseFloat(val);
      if (!isNaN(num) && num > 0) {
        return num.toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ₽';
      }
      return '';
    }

    function updateButton() {
      const val = parseFloat(input.value);
      const isValid = !isNaN(val) && val > 0;
      payBtn.disabled = !isValid;
      payBtn.setAttribute('aria-disabled', String(!isValid));

      if (isValid) {
        errorEl.classList.remove('visible');
        payBtn.innerHTML = `
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          Оплатить ${formatAmount(input.value)}
        `;
      } else {
        payBtn.innerHTML = `
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          Оплатить
        `;
      }
    }

    input.addEventListener('input', () => {
      updateButton();
      // brief pulse animation on value change
      input.classList.remove('pulse');
      void input.offsetWidth;
      if (parseFloat(input.value) > 0) input.classList.add('pulse');
    });

    input.addEventListener('blur', () => {
      const val = parseFloat(input.value);
      if (input.value !== '' && (isNaN(val) || val <= 0)) {
        errorEl.classList.add('visible');
      }
    });

    // ─── Pay Button — Loading → Success ───
    payBtn.addEventListener('click', () => {
      const val = parseFloat(input.value);
      if (isNaN(val) || val <= 0) return;

      // Loading state
      payBtn.disabled = true;
      payBtn.innerHTML = `
        <svg class="btn-icon spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.22-8.56"/>
        </svg>
        Обрабатываем…
      `;

      setTimeout(() => {
        showSuccess(val);
      }, 1400);
    });

    // ─── Success Screen ───
    function showSuccess(amount) {
      const overlay = document.getElementById('success-overlay');
      const amountEl = document.getElementById('success-amount');
      amountEl.textContent = formatAmount(String(amount));

      overlay.classList.add('active');
      overlay.focus();
      launchConfetti();
    }

    document.getElementById('new-payment-btn').addEventListener('click', () => {
      const overlay = document.getElementById('success-overlay');
      overlay.classList.remove('active');
      input.value = '';
      updateButton();
      input.focus();
    });

    // ─── Confetti ───
    function launchConfetti() {
      const colors = [
        'var(--color-primary)', '#818cf8', '#a5b4fc',
        '#34d399', '#fbbf24', '#f472b6', '#60a5fa'
      ];
      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'confetti-particle';
          const x = Math.random() * window.innerWidth;
          const tx = (Math.random() - 0.5) * 300;
          const ty = Math.random() * 600 + 200;
          const rot = (Math.random() - 0.5) * 720;
          const dur = (Math.random() * 1.2 + 0.8).toFixed(2) + 's';
          el.style.cssText = `
            left:${x}px; top:-10px;
            background:${colors[Math.floor(Math.random() * colors.length)]};
            --tx:${tx}px; --ty:${ty}px; --rot:${rot}deg; --duration:${dur};
            width:${Math.random() * 6 + 5}px;
            height:${Math.random() * 6 + 5}px;
            border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
          `;
          document.body.appendChild(el);
          const d = parseFloat(dur) * 1000 + 100;
          setTimeout(() => el.remove(), d);
        }, i * 22);
      }
    }
  </script>
</body>
</html>
